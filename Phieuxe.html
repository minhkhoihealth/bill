<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu mượn xe đạp</title>

<style>
@page {
  size: 90mm 56mm;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #eee;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== PHIẾU ===== */
.ticket {
  position: relative;
  width: 90mm;
  height: 56mm;
  margin: 10px auto;
  padding: 4.5mm 2.5mm 2mm;
  background: #fff;
  overflow: hidden;
  border: 0.7mm solid #111;
  box-shadow: 0 0 3px rgba(0,0,0,.45);
}

/* ===== WATERMARK ===== */
.watermark {
  position: absolute;
  left: 50%;
  top: 53%;
  width: 45mm;
  height: 45mm;
  transform: translate(-50%, -50%);
  opacity: .055;
  z-index: 0;
}

.watermark svg {
  width: 100%;
  height: 100%;
}

/* ===== NỘI DUNG ===== */
.content {
  position: relative;
  z-index: 2;
}

.title {
  text-align: center;
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 6.1mm;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .15mm;
  margin: 0;
}

.subtitle {
  text-align: center;
  font-size: 4.15mm;
  line-height: 1;
  margin-top: 2mm;
  letter-spacing: .05mm;
}

/* ===== THÔNG TIN ===== */
.info {
  margin-top: 9.2mm;
  font-size: 4.25mm;
  line-height: 1.65;
  white-space: nowrap;
}

.row {
  display: flex;
  align-items: baseline;
}

.label {
  flex: 0 0 auto;
}

.dots {
  flex: 1;
  min-width: 0;
  height: 4.6mm;
  margin-left: 1mm;
  border-bottom: 0.45mm dotted #111;
}

/* ===== GHI CHÚ ===== */
.note {
  position: absolute;
  left: 2.5mm;
  right: 2.5mm;
  bottom: 4.7mm;
  text-align: center;
  font-size: 3.35mm;
  line-height: 1.15;
  font-style: italic;
  z-index: 2;
}

.note-en {
  display: block;
  margin-top: .8mm;
  font-size: 2.35mm;
  font-style: normal;
}

/* ===== NÚT ===== */
.buttons {
  text-align: center;
  margin: 12px auto;
}

button {
  padding: 7px 16px;
  margin: 3px;
  border: 0;
  border-radius: 4px;
  background: #222;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  opacity: .85;
}

@media print {
  html, body {
    background: white;
  }

  .ticket {
    margin: 0;
    box-shadow: none;
    page-break-after: always;
  }

  .buttons {
    display: none;
  }
}
</style>
</head>

<body>

<div class="buttons">
  <button onclick="window.print()">🖨 In phiếu</button>
  <button onclick="closePage()">✕ Đóng</button>
</div>

<div class="ticket">

  <!-- WATERMARK HÌNH XE ĐẠP -->
  <div class="watermark">
    <svg viewBox="0 0 200 200" fill="none"
         xmlns="http://www.w3.org/2000/svg">
      <circle cx="55" cy="145" r="30" stroke="#000" stroke-width="7"/>
      <circle cx="145" cy="145" r="30" stroke="#000" stroke-width="7"/>
      <path d="M55 145L83 91L110 145L55 145Z"
            stroke="#000" stroke-width="7"
            stroke-linejoin="round"/>
      <path d="M83 91L117 91L145 145"
            stroke="#000" stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M103 72L117 91"
            stroke="#000" stroke-width="7"
            stroke-linecap="round"/>
      <path d="M76 91L91 91"
            stroke="#000" stroke-width="7"
            stroke-linecap="round"/>
      <path d="M117 91L132 72"
            stroke="#000" stroke-width="7"
            stroke-linecap="round"/>
      <path d="M127 69L139 69"
            stroke="#000" stroke-width="7"
            stroke-linecap="round"/>
    </svg>
  </div>

  <div class="content">

    <div class="title">PHIẾU MƯỢN XE ĐẠP</div>
    <div class="subtitle">BICYCLE BORROWING FORM</div>

    <div class="info">

      <div class="row">
        <span class="label">Số phòng/Room No:</span>
        <span class="dots"></span>
      </div>

      <div class="row">
        <span class="label">Số lượng/Quantity:</span>
        <span class="dots"></span>
      </div>

      <div class="row">
        <span class="label">Ngày/Date:</span>
        <span class="dots"></span>
      </div>

    </div>

  </div>

  <div class="note">
    Vui lòng xuất trình thẻ này cho bảo vệ để lấy và trả xe
    <span class="note-en">
      Please present this card to the security guard when picking up and returning the bicycle.
    </span>
  </div>

</div>

<script>
function closePage() {
  window.close();

  setTimeout(() => {
    window.history.back();
  }, 300);
}
</script>

</body>
</html>
