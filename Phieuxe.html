<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phiếu mượn xe đạp</title>

<style>
@page {
  size: 80mm 56mm;
  margin: 0;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #eee;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== PHIẾU 80MM ===== */
.ticket {
  position: relative;
  width: 80mm;
  height: 56mm;
  margin: 10px auto;
  padding: 3.5mm 2mm 1.5mm;
  background: #fff;
  overflow: hidden;
  border: 0.7mm solid #111;
  box-shadow: 0 0 3px rgba(0,0,0,.45);

  display: flex;
  flex-direction: column;
}

/* ===== LOGO CHÌM ===== */
.watermark {
  position: absolute;
  left: 50%;
  top: 51%;
  width: 40mm;
  height: 40mm;
  transform: translate(-50%, -50%);
  opacity: .08;
  z-index: 0;
  pointer-events: none;
}

.watermark img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ===== NỘI DUNG ===== */
.content {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
}

.title {
  text-align: center;
  font-family: "Arial Black", Arial, Helvetica, sans-serif;
  font-size: 5.7mm;
  line-height: 1;
  font-weight: 900;
  letter-spacing: .05mm;
  margin: 0;
}

.subtitle {
  text-align: center;
  font-size: 3.8mm;
  line-height: 1;
  margin-top: 1.5mm;
}

/* ===== THÔNG TIN ===== */
.info {
  margin-top: 6.5mm;
  font-size: 3.9mm;
  line-height: 1;
}

.row {
  display: flex;
  align-items: flex-end;
  width: 100%;
  height: 6.2mm;
  margin-bottom: 1.2mm;
}

.label {
  flex: 0 0 auto;
  white-space: nowrap;
}

.value {
  flex: 1 1 auto;
  min-width: 0;
  height: 5.2mm;
  margin-left: 1mm;
  padding: 0 0.5mm;
  border-bottom: 0.45mm dotted #111;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
}

/* ===== GHI CHÚ ===== */
.note {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  margin-top: auto;
  padding: 0 0.5mm;
  text-align: center;
  font-size: 2.7mm;
  line-height: 1.15;
  font-style: italic;
}

.note-en {
  display: block;
  margin-top: .5mm;
  font-size: 1.9mm;
  font-style: normal;
  white-space: nowrap;
}

/* ===== NÚT ===== */
.buttons {
  text-align: center;
  margin: 12px auto;
}

button {
  padding: 7px 16px;
  margin: 3px;
  border: 0;
  border-radius: 4px;
  background: #222;
  color: #fff;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  opacity: .85;
}

@media print {
  html, body {
    width: 80mm;
    height: 56mm;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .ticket {
    margin: 0;
    box-shadow: none;
  }

  .buttons {
    display: none;
  }
}
</style>
</head>

<body>

<div class="buttons">
  <button onclick="window.print()">🖨 In phiếu</button>
  <button onclick="closePage()">✕ Đóng</button>
</div>

<div class="ticket">

  <!-- LOGO TRUYỀN QUA ?logo= -->
  <div class="watermark">
    <img id="logo" alt="">
  </div>

  <div class="content">

    <div class="title">PHIẾU MƯỢN XE ĐẠP</div>
    <div class="subtitle">BICYCLE BORROWING FORM</div>

    <div class="info">

      <div class="row">
        <span class="label">Số phòng/Room No:</span>
        <span class="value" id="sophong"></span>
      </div>

      <div class="row">
        <span class="label">Số lượng/Quantity:</span>
        <span class="value" id="soluong"></span>
      </div>

      <div class="row">
        <span class="label">Ngày/Date:</span>
        <span class="value" id="ngaytao"></span>
      </div>

    </div>

  </div>

  <!-- PHẦN NÀY KHÔNG CÒN POSITION ABSOLUTE,
       nên sẽ không đè lên dòng Ngày -->
  <div class="note">
    Vui lòng xuất trình thẻ này cho bảo vệ để lấy và trả xe
    <span class="note-en">
      Please present this card to the security guard when picking up and returning the bicycle.
    </span>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

/* ===== NHẬN THAM SỐ URL ===== */
const logo = params.get("logo") || "";
const sophong = params.get("sophong") || "";
const soluong = params.get("soluong") || "";
const ngaytao = params.get("ngaytao") || "";

/* ===== HIỂN THỊ ===== */
document.getElementById("sophong").textContent = sophong;
document.getElementById("soluong").textContent = soluong;

/* ===== ĐỔI NGÀY MM/DD/YYYY -> DD/MM/YYYY ===== */
function formatDate(value) {
  if (!value) return "";

  const match = value.match(
    /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
  );

  if (!match) return value;

  const month = match[1].padStart(2, "0");
  const day = match[2].padStart(2, "0");
  const year = match[3];

  const hour = match[4] ? match[4].padStart(2, "0") : "";
  const minute = match[5] || "";
  const second = match[6] || "";

  if (hour) {
    return `${day}/${month}/${year} ${hour}:${minute}${second ? ":" + second : ""}`;
  }

  return `${day}/${month}/${year}`;
}

document.getElementById("ngaytao").textContent = formatDate(ngaytao);

/* ===== LOGO ===== */
if (logo && /^https?:\/\//i.test(logo)) {
  document.getElementById("logo").src = logo;
} else {
  document.querySelector(".watermark").style.display = "none";
}

/* ===== ĐÓNG ===== */
function closePage() {
  window.close();

  setTimeout(() => {
    window.history.back();
  }, 300);
}
</script>

</body>
</html>
